# NOVA Voice Pipeline Configuration
# Separates voice engine from AI provider for maximum flexibility

# Voice Input Configuration
[voice_input]
# Microphone device selection (auto-detect default)
default_microphone = "auto"
# Voice Activity Detection settings
vad_threshold = 0.5
vad_silence_duration = 0.5  # seconds of silence to detect end of speech
vad_enabled = true

# Voice Output Configuration
[voice_output]
# TTS engine selection: piper, kokoro, openai, elevenlabs
default_tts_engine = "kokoro"
# Speaker device selection (auto-detect default)
default_speaker = "auto"
# Audio output volume (0.0 to 1.0)
output_volume = 0.8

# Voice Engine Specific Configuration

[voice_engine.piper]
# Piper model directory
models_dir = "$HOME/.nova/voices/piper"
# Default voice model
default_voice = "en_US-lessac-medium"
# Voice fallback chain
fallback_voices = ["en_US-journey-m", "en_US-santa-m"]

[voice_engine.kokoro]
# Kokoro model selection
model_size = "medium"  # small, medium, large
language_group = "en"  # en, es, fr, de, etc.
voice_name = "Heart"  # From the 54 available voices

[voice_engine.openai]
# OpenAI TTS voice names: allay, coral, echo, fable, nova, shimmer, onyx, shadocroft, slate, steel, storyteller, sun, meteor, volcanic
openai_voice = "nova"
# Speech rate percentage
speech_rate = 100

[voice_engine.elevenlabs]
# ElevenLabs voice ID
voice_id = "pNIn9jgD2v below 8s1qxq"
# Model ID
model_id = "eleven_flash_v2_5"
# Stability factor (0.0 to 1.0)
stability = 0.5
# Similarity boost (0.0 to 1.0)
similarity_boost = 0.75

# Echo Cancellation (PipeWire)
[echo_cancellation]
enabled = true
# PipeWire node name
pipewire_node = "default"
# Playback reference for echo cancellation
reference_audio = true

# Wake Word (optional, later milestone)
[wake_word]
enabled = false
phrase = "Hey Nova"
engine = "openWakeWord"
# Sensitivity 0.0 to 1.0
sensitivity = 0.5

# AI Provider Routing
[ai_providers]
# Primary provider: OpenClaw, Ollama, OpenAI, Claude, ElevenLabs
primary = "OpenClaw"

[ai_providers.OpenClaw]
# Gateway URL
gateway_url = "http://localhost:8765"
# API key (should be in secure storage)
api_key_path = "$HOME/.nova/credentials/openclaw.key"

[ai_providers.Ollama]
# Ollama server URL
server_url = "http://localhost:11434"
# Default model
default_model = "nemotron:3.5b"

[ai_providers.OpenAI]
# OpenAI API key path
api_key_path = "$HOME/.nova/credentials/openai.key"
# Default model
default_model = "gpt-4o-mini"

[ai_providers.Claude]
# Claude API key path
api_key_path = "$HOME/.nova/credentials/claude.key"
# Default model
default_model = "claude-3-5-sonnet-20240620"

# Session Management
[session]
# Conversation ID generation
auto_generate_id = true
# Session timeout (seconds)
timeout = 3600
# History preservation
preserve_history = true

# Privacy
[privacy]
# Local-only mode (no data leaves machine)
local_only = false
# Secure credential storage
secure_storage = true
# Audit logging
audit_log = "$HOME/.nova/logs/audit.jsonl"