<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" aria-label="NOVA orb">
  <!-- Orb base -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#0891b2" stroke-width="2" opacity="0.22"/>
  <!-- Orb fill -->
  <circle cx="50" cy="50" r="25" fill="#0891b2" opacity="0.8"/>
  <!-- Thinking rotation -->
  <path d="M50 6 A44 44 0 0 1 94 50" fill="none" stroke="#0891b2" stroke-width="3">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Pulse for Listening/Speaking -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#0891b2" opacity="0.6">
    <animate attributeName="r" values="32;46;32" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <!-- Idle breathing -->
  <circle cx="50" cy="50" r="24" fill="none" stroke="#0891b2" opacity="0.5">
    <animate attributeName="r" values="24;27;24" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>